[package]
name = "memory-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ndarray = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
parking_lot = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt"] }

# Optional: candle-transformers for BGE embedding (not in default — enable via
# `--features embedding` when local inference is actually needed).
candle-transformers = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
tokenizers = { version = "0.21", optional = true }

[dev-dependencies]
memory-test-fixtures = { path = "../memory-test-fixtures" }
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = []
embedding = ["candle-transformers", "candle-nn", "tokenizers"]
sqlite-vec = ["rusqlite/vtab"]
daemon = ["tokio/rt-multi-thread", "tokio/macros"]
